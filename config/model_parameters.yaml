data:
  sources:
    '2025': data/2025/survey_results_public.csv
    '2026': data/2026/survey_results_public.csv
  column_renames:
    '2026':
      Education: EdLevel
      Role: DevType
      Compensation: CompTotal
  category_mappings:
    '2026': config/category_mapping_2026.yaml
  currency_rates:
    '2025': config/currency_rates.yaml
    '2026': config/currency_rates_2026.yaml
  min_salary: 1000
  lower_percentile: 2
  upper_percentile: 98
  salary_scale: 0.001
  test_size: 0.2
  random_state: 42
features:
  cardinality:
    max_categories: 50
    min_frequency: 100
    other_category: Other
    drop_other_from:
    - Country
    - DevType
    - Industry
    - Age
    - ICorPM
    - OrgSize
    - Employment
  encoding:
    drop_first: true
model:
  n_estimators: 5000
  learning_rate: 0.03583361975423634
  max_depth: 5
  min_child_weight: 22
  random_state: 42
  n_jobs: -1
  early_stopping_rounds: 50
  subsample: 0.9381707697983603
  colsample_bytree: 0.5200616348808067
  reg_alpha: 0.12142719406076818
  reg_lambda: 0.009883690634571804
  gamma: 4.224042651355416
conformal:
  coverage: 0.8
  output_path: config/conformal_intervals.yaml
training:
  verbose: false
  save_model: true
  model_path: models/model.pkl
guardrails:
  max_mape_per_category: 100
  max_abs_pct_diff: 100
